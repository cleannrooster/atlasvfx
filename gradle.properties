org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Minecraft / mappings
minecraft_version=1.21.1
# Yarn on both loaders, as in the mods that use this. Architectury Loom drives NeoForge from
# Yarn names given the patch artifact below, and remaps the published NeoForge jar to the
# names NeoForge runs on, so a consumer on either mapping set can depend on it.
yarn_mappings=1.21.1+build.3
yarn_mappings_patch_neoforge_version=1.21+build.6

enabled_platforms=fabric,neoforge
fabric_loader_version=0.16.5
fabric_api_version=0.102.0+1.21.1
neoforge_version=21.1.219
# Loader-neutral events: client ticks, joining and leaving, and the world render hook's own.
architectury_api_version=13.0.8

# Mod
mod_version=0.1.0
maven_group=dev.eann
archives_name=atlasvfx
