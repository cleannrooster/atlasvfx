plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

// Projects configure alphabetically, so example-* would come before the library's own; the
// library's project has to be configured first for its shadow jar to be referenced.
evaluationDependsOn(':fabric')
def libraryJar = rootProject.project(':fabric').tasks.named('shadowJar')

// Mods run beside the example in its dev client only, never a dependency of the library: Better
// Combat poses the vanilla player through PlayerAnimator, which is what a replacement model in
// follow mode should pick up.
repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.kosmx.dev/' }
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ':example-common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':example-common', configuration: 'transformProductionFabric')

    // Compiled against the library...
    compileOnly(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    // ...and run with it as a real mod: its dev shadow jar holds its metadata, widener and
    // classes in one place, which is what the dev client's mod discovery needs.
    localRuntime files(libraryJar.flatMap { it.archiveFile })

    modLocalRuntime("maven.modrinth:better-combat:2.3.0+1.21.1-fabric") { transitive = false }
    modLocalRuntime("dev.kosmx.player-anim:player-animation-lib-fabric:2.0.4+1.21.1") { transitive = false }
    modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:15.0.140") { transitive = false }
}

tasks.named('runClient') { dependsOn libraryJar }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

// Dev only: never published.
tasks.withType(AbstractPublishToMaven).configureEach { enabled = false }
