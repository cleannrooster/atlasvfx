plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // Declaring the platform through Loom's own configuration -- together with
    // loom.platform=neoforge in this module's gradle.properties -- is what puts Loom in
    // NeoForge mode. Without it Loom stays on its Fabric default and remapJar emits
    // intermediary names into a jar NeoForge cannot link.
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modApi "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        // NeoForge's Maven version parser rejects '+', so strip build metadata from every value.
        def cleanedProps = project.properties.collectEntries { key, value ->
            def text = value?.toString()
            [(key.toString()): (text?.contains('+') ? text.substring(0, text.indexOf('+')) : text)]
        }
        expand(cleanedProps)
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
